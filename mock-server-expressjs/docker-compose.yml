services:
  app-1:
    build:
      context: .
    container_name: mock-app-1
    environment:
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s



  gateway:
    image: nginx:stable-alpine
    container_name: mock-gateway
    depends_on:
      - app-1

    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
